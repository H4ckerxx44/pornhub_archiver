[project]
name = "pornhub-archiver"
version = "1.0.1"
description = "pornhuber archiver"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "aiohttp>=3.13.2",
    "arrow>=1.4.0",
    "humanize>=4.14.0",
    "pyan==0.1.3",
    "rich>=15.0.0",
    "yt-dlp>=2026.2.21",
    "pyrefly>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
