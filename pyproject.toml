[project]
name = "pornhub-archiver"
version = "1.0.1"
description = "pornhuber archiver"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "aiohttp>=3.13.2",
    "arrow>=1.4.0",
    "pyan==0.1.3",
    "rich>=15.0.0",
    "yt-dlp>=2026.2.21",
]

[tool.setuptools.packages.find]
where = ["src"]
