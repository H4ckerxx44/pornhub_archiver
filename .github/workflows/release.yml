name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"

          if [ -n "$previous_tag" ]; then
            {
              echo "Changes since $previous_tag:"
              echo
              git log --pretty="- %s - %an (%h)" "$previous_tag..$GITHUB_REF_NAME"
            } > release-notes.md
          else
            git log --pretty="- %s - %an (%h)" "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
